[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "copticocr"
version = "0.1.0"
description = "OCR for Coptic liturgical books (Coptic + Arabic), including legacy ANSI Coptic fonts"
readme = "README.md"
license = "AGPL-3.0-or-later"
authors = [{ name = "Mishel Makram" }]
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
]

[project.optional-dependencies]
train = ["fonttools>=4.50", "pillow>=10", "numpy>=1.26"]
dev = ["pytest>=8", "copticocr[train]"]

[project.scripts]
copticocr-legacy = "copticocr.legacy.cli:main"
copticocr-synth = "copticocr.synth.generate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"copticocr.legacy" = ["maps/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
