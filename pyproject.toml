[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "copticocr"
version = "0.1.0"
description = "OCR for Coptic liturgical books (Coptic + Arabic), including legacy ANSI Coptic fonts"
readme = "README.md"
license = "AGPL-3.0-or-later"
authors = [{ name = "Mishel Makram" }]
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
]

[project.optional-dependencies]
# PyTorch with CUDA: pip install torch --index-url https://download.pytorch.org/whl/cu126
train = ["fonttools>=4.50", "pillow>=10", "numpy>=1.26", "torch>=2.5", "rapidfuzz>=3"]
app = ["PySide6>=6.7", "python-docx>=1.1", "pillow>=10", "numpy>=1.26", "onnxruntime>=1.20", "scipy>=1.11",
       "potracer>=0.0.4"]
dev = ["pytest>=8", "copticocr[train,app]"]

[project.scripts]
copticocr-legacy = "copticocr.legacy.cli:main"
copticocr-synth = "copticocr.synth.generate:main"

[project.gui-scripts]
copticocr = "copticocr.app.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"copticocr.legacy" = ["maps/*.json"]
"copticocr" = ["assets/fonts/*", "assets/copticocr.ico", "assets/copticocr.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
